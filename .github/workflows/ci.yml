name: CI

# Commits that only touch docs or README screenshots can't break the build, so they skip CI.
# None of these files are compiled into the app.
on:
  push:
    # Tagging a release must not repeat the branch's build and tests.
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/screenshot-*.png"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/screenshot-*.png"

# Building and testing needs only to read the repository.
permissions:
  contents: read

# A new push supersedes the run for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Part of the cache key. Change it when the cached profile changes: an exact key hit
          # never saves a new cache, so a stale one would be rebuilt from scratch every run.
          prefix-key: v2-ci
      # Compile Komando without optimisation for quick feedback. Dependencies retain the dev
      # profile's optimisations, and both commands share the same profile and cache.
      - name: Build
        run: cargo build --profile ci --locked --timings
      # The integration suites that need nothing but the test process: each runs its own SSH
      # server in process. agent.rs is Unix-only; the other tests/ suites are ignored
      # benchmarks or open native windows.
      - name: Test
        run: cargo test --profile ci --locked --timings --lib --test sign_in --test forwards --test latency
      - name: Test update handoff
        shell: powershell
        run: ./packaging/test-update.ps1
      # The installer is otherwise only built for a release; building it from the CI program
      # here catches mistakes in packaging/ before then.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build installer
        shell: pwsh
        run: ./packaging/build-msi.ps1 -Version 0.0.0 -BinDir target\ci -Out Komando-ci.msi
      - name: Save build timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-timings
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Build and test (Linux)
    # The runner releases are built on.
    runs-on: ubuntu-22.04
    env:
      RUST_FONTCONFIG_DLOPEN: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-ci
      - name: Build
        run: cargo build --profile ci --locked
      # Nothing else builds the examples, so this keeps them from breaking unnoticed.
      - name: Check examples
        run: cargo check --profile ci --locked --examples
      # As on Windows, plus the SSH Agent suite, which needs Unix sockets.
      - name: Test
        run: cargo test --profile ci --locked --lib --test sign_in --test agent --test forwards --test latency
      # Packaging is otherwise only exercised by a release.
      - name: Package
        run: ./packaging/build-linux.sh 0.0.0 target/ci/komando Komando-ci-linux.tar.gz && tar -tzf Komando-ci-linux.tar.gz
      # Installs the tarball the way a user does, into a HOME with a space in its path and an
      # empty XDG_DATA_HOME, then uninstalls it again.
      - name: Install and uninstall the package
        run: |
          work=$(mktemp -d)
          tar -C "$work" -xzf Komando-ci-linux.tar.gz
          export HOME="$work/home with space"
          mkdir -p "$HOME"
          XDG_DATA_HOME= sh "$work/komando-0.0.0/install.sh"
          test -x "$HOME/.local/bin/komando"
          test -f "$HOME/.local/share/applications/komando.desktop"
          test -f "$HOME/.local/share/icons/hicolor/512x512/apps/komando.png"
          XDG_DATA_HOME= sh "$work/komando-0.0.0/uninstall.sh"
          test ! -e "$HOME/.local/bin/komando"
          test ! -e "$HOME/.local/share/applications/komando.desktop"
