name: CI

# Commits that only touch docs or README screenshots can't break the build, so they skip CI.
# None of these files are compiled into the app.
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/screenshot-*.png"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/screenshot-*.png"

# A new push supersedes the run for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Part of the cache key. Change it when the cached profile changes: an exact key hit
          # never saves a new cache, so a stale one would be rebuilt from scratch every run.
          prefix-key: v1-dev
      # The dev profile (see Cargo.toml) skips the release profile's thin LTO, which re-optimises
      # all of gpui on every link and made CI builds take minutes. The Release workflow still
      # builds the shipping profile. Build and test share the same dependencies.
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --lib --locked
      - name: Test update handoff
        shell: powershell
        run: ./packaging/test-update.ps1
      # The installer is otherwise only built for a release; building it from the debug program
      # here catches mistakes in packaging/ before then.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build installer
        shell: pwsh
        run: ./packaging/build-msi.ps1 -Version 0.0.0 -BinDir target\debug -Out Komando-ci.msi
