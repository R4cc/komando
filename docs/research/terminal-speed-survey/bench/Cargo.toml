[package]
name = "sshbench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
mimalloc = ["dep:mimalloc"]

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
ring = "0.17.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
alacritty_terminal = "0.26"
bytes = "1"
mimalloc = { version = "0.1", optional = true, default-features = false }

[patch.crates-io]
russh = { path = "../../../../vendor/russh" }
vte = { path = "../../../../vendor/vte" }
alacritty_terminal = { path = "../../../../vendor/alacritty_terminal" }

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

[profile.fat]
inherits = "release"
lto = "fat"
codegen-units = 1
