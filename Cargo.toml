[package]
name = "komando"
version = "0.9.2"
edition = "2024"
description = "A fast terminal for system engineers who SSH into Linux machines."
license-file = "LICENSE"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.9.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-kit-assets = "=0.9.1"
alacritty_terminal = "0.26"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
russh-sftp = "3.0.1"
argon2 = "0.6"
chacha20poly1305 = "0.11"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 1.x: 0.8's writer counted quotes in a row in a `u8` and panicked on 256 of them.
toml = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
regex = "1"
futures = "0.3"
log = "0.4"
rustc-hash = "2"
chrono = "0.4"
base64 = "0.23"
sha2 = "0.11"
ureq = { version = "2", default-features = false, features = ["tls", "proxy-from-env"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
# Remote desktops (see docs/adr/0012-remote-desktops-are-sessions-of-a-host.md): RDP through
# IronRDP, VNC through vnc-rs, both drawn by Komando. Only what a plain desktop needs: text on
# the clipboard but no audio or drive redirection, and ring rather than aws-lc (no CMake or
# NASM to build).
ironrdp-connector = "0.12"
ironrdp-cliprdr = "0.9"
ironrdp-svc = "0.10"
ironrdp-session = "0.13"
ironrdp-core = "0.3"
ironrdp-pdu = "0.11"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", default-features = false, features = ["rustls-ring"] }
vnc-rs = "0.6.1"
# A desktop's picture is handed to gpui as an `image::Frame`.
image = { version = "0.25", default-features = false }
smallvec = "1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# Windows: also trust the Windows certificate store (Schannel); see update.rs.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# CI checks behaviour and packaging; optimising Komando itself costs more time than the
# tests take to run. Keep the dev profile's dependency overrides and runtime checks.
[profile.ci]
inherits = "dev"
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Komando is built for Windows 11, Linux and macOS (docs/adr/0014-linux-and-macos-builds.md).
# Linux: both display servers. Wayland, Vulkan and fontconfig are loaded when the app starts;
# only libxcb and libxkbcommon are linked.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["x11", "wayland"] }

# macOS: without font-kit GPUI's Mac backend has no text system and draws no text at all.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The TOML reader of Komando 0.8 and older, so tests can check that settings and the Library
# written now still open in them. Already built for rust-i18n.
[dev-dependencies]
toml_0_8 = { package = "toml", version = "0.8" }

# The text system GPUI uses on Linux, for the headless render benchmark (`render_bench_`). GPUI
# already depends on it; this only makes it reachable from tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12", features = ["font-kit"] }

# russh with one change: a channel can keep a receive window of its own (the shell's is
# paced, SFTP's stays large). See vendor/russh/KOMANDO.md.
# vte and alacritty_terminal with one change: printable ASCII is parsed and written to the
# grid in runs rather than one character at a time. See vendor/vte/KOMANDO.md and
# vendor/alacritty_terminal/KOMANDO.md.
# gpui's Windows backend with three changes to how a window moves, resizes and sits in the
# tray. See vendor/gpui-pre-windows/KOMANDO.md.
# gpui-component's menus report the item the arrow keys or pointer are on, so the theme
# menus can show each theme as you move over it. See vendor/gpui-component/KOMANDO.md.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
russh = { path = "vendor/russh" }
vte = { path = "vendor/vte" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
gpui-component = { path = "vendor/gpui-component" }
